name: Display Profile UX Refactor

on:
  push:
    branches: [fix/display-profile-ux]

permissions:
  contents: write

jobs:
  refactor-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/display-profile-ux
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: display-profile-ux
      - name: Apply backend refactor
        run: python tools/_refactor_display_backend.py
      - name: Apply UI refactor
        run: python tools/_refactor_display_ui.py
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Commit verified refactor
        shell: pwsh
        run: |
          Remove-Item tools/_refactor_display_backend.py
          Remove-Item tools/_refactor_display_ui.py
          Remove-Item .github/workflows/display-profile-ux-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(display): make profile editor route-aware"
          git push origin HEAD:fix/display-profile-ux
