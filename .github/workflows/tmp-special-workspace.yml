name: tmp-special-workspace

on:
  push:
    branches:
      - wip/special-workspace-build

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/special-workspace-build
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate rewrite
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_special_workspace.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          git diff --check
      - name: Commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp_special_workspace.py .github/workflows/tmp-special-workspace.yml
          git add src/desktop/internal_api.rs src/desktop/service.rs src/desktop/state.rs src/ui/layout.rs
          git commit -m "feat(desktop): use dedicated special workspace"
          git push origin HEAD:wip/special-workspace-build
