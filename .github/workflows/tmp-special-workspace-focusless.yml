name: tmp-special-workspace-focusless

on:
  push:
    branches:
      - wip/special-workspace-build

permissions:
  contents: write

jobs:
  focusless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/special-workspace-build
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply and validate focusless transitions
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_special_workspace_focusless.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --all-targets --all-features
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          git diff --check
      - name: Commit validated transition policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp_special_workspace_focusless.py .github/workflows/tmp-special-workspace-focusless.yml
          git add src/desktop/service.rs
          git commit -m "fix(desktop): leave special workspace focus to Shell"
          git push origin HEAD:wip/special-workspace-build
