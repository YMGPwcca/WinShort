name: P0 UX refinement

on:
  push:
    branches: [wip/p0-ux-refinement]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  validate-pass-1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: wip/p0-ux-refinement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Apply pass 1
        run: python .github/scripts/p0_ux_pass1.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Targeted UI regressions
        run: cargo test --all-features ui:: -- --nocapture
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Full tests
        run: cargo test --all-features
      - name: Release build
        run: cargo build --release --all-features
      - name: Commit pass 1
        env:
          BRANCH: wip/p0-ux-refinement
        run: |
          git add src docs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): refine Control Center interaction surfaces"
          git push origin HEAD:"$BRANCH"
