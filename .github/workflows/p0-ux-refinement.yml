name: P0 UX refinement

on:
  push:
    branches: [wip/p0-ux-refinement]

permissions:
  contents: write
defaults:
  run:
    shell: bash

jobs:
  validate-pass-2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: wip/p0-ux-refinement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Scope pass 2 paint marker
        run: python .github/scripts/fix_p0_pass2_driver.py
      - name: Materialize per-shortcut controls
        run: python .github/scripts/p0_ux_pass2.py
      - name: Format
        run: cargo fmt --all
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Full tests
        run: cargo test --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --release --all-features
      - name: Commit validated pass 2
        env:
          BRANCH: wip/p0-ux-refinement
        run: |
          git add src docs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(shortcuts): add per-binding controls"
          git push origin HEAD:"$BRANCH"
