name: P0 UX refinement

on:
  push:
    branches: [wip/p0-ux-refinement]

permissions:
  contents: write
defaults:
  run:
    shell: bash

jobs:
  materialize-validated-patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: wip/p0-ux-refinement
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Materialize and validate UX pass 1
        run: |
          python .github/scripts/p0_ux_pass1.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --all-features ui:: -- --nocapture
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
          cargo build --release --all-features
      - name: Commit validated UX pass 1
        env:
          BRANCH: wip/p0-ux-refinement
        run: |
          git add src docs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ui): refine Control Center interaction surfaces"
          git push origin HEAD:"$BRANCH"
