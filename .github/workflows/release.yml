name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub Release (default: dry-run, build/package only)'
        type: boolean
        default: false
      ref_override:
        description: 'Optional tag/ref to build (dry-run only)'
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  gates-and-build:
    name: gates + build (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref_override || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rel-${{ matrix.target }}

      - name: Version match guard (tag == Cargo.toml)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${G_REF#v}"
          CRATE=$(cargo metadata --no-deps --format-version 1 | python -c "import sys,json;print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "tag=$TAG crate=$CRATE"
          [ "$TAG" = "$CRATE" ] || { echo "tag version != Cargo.toml version"; exit 1; }
        env:
          G_REF: ${{ github.ref_name }}

      - name: Gates (fmt/clippy/test/deny are enforced by CI on main before tagging)
        run: cargo test

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # --- Authenticode signing hook (future) -----------------------------
      # Signing happens HERE, on the built binary, BEFORE packaging and
      # checksums so SHA256SUMS.txt covers the final signed artifact.
      # Expected secrets when enabled:
      #   SIGNING_CERT_PFX_B64 : base64-encoded PFX certificate
      #   SIGNING_CERT_PASSWORD: PFX password
      - name: Sign binary (Authenticode) — skipped unless secrets present
        env:
          SIGNING_CERT_PFX_B64: ${{ secrets.SIGNING_CERT_PFX_B64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        if: env.SIGNING_CERT_PFX_B64 != '' && env.SIGNING_CERT_PASSWORD != ''
        run: |
          echo "$SIGNING_CERT_PFX_B64" | base64 -d > cert.pfx
          SIGNTOOL="$(ls '/c/Program Files (x86)/Windows Kits/10/bin/'*-x64/signtool.exe | sort | tail -1)"
          "$SIGNTOOL" sign /fd SHA256 /f cert.pfx /p "$SIGNING_CERT_PASSWORD" \
            "target/${{ matrix.target }}/release/winshort.exe"
          rm cert.pfx

      - name: Package ZIP
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python -c "import sys,json;print(json.load(sys.stdin)['packages'][0]['version'])")
          ARCH=${{ matrix.target }}
          case "$ARCH" in x86_64*) SHORT=x86_64;; i686*) SHORT=i686;; *) SHORT="$ARCH";; esac
          NAME="WinShort-v${VERSION}-windows-${SHORT}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/winshort.exe" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/" 2>/dev/null || true
          cd "dist"
          zip -r "${NAME}.zip" "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.target }}
          path: dist/*.zip

  checksums-release:
    name: checksums + release
    needs: gates-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Insert point for any repository-level signing of bundles (already
      # Authenticode-signed per-binary in gates-and-build when configured).

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
