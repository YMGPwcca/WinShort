name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: clippy
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: test
      - name: cargo test
        run: cargo test --all-features

  release-build:
    name: release-build (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rel-x64
      - name: cargo build --release
        run: cargo build --release
      - name: Verify embedded manifest resources
        run: |
          python - <<'PY'
          data = open('target/release/winshort.exe','rb').read()
          assert b'PerMonitorV2' in data, 'PerMonitorV2 missing from manifest'
          assert b'asInvoker' in data, 'asInvoker missing from manifest'
          print('manifest OK')
          PY
      - name: Verify embedded application icon
        run: python tools/verify_pe_icon.py target/release/winshort.exe
      - name: release UIA nullable ABI regression
        run: cargo test --release --all-features nullable_provider_abi_regression -- --nocapture

  cross-i686:
    name: cross-check i686
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: chk-i686
      - name: cargo check (i686)
        run: cargo check --target i686-pc-windows-msvc

  cross-aarch64:
    name: cross-check aarch64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: chk-aarch64
      - name: cargo check (aarch64)
        run: cargo check --target aarch64-pc-windows-msvc

  msrv:
    name: msrv (1.85)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: msrv
      # NOTE: declared MSRV is 1.85 — above the windows-crate floor of 1.82 —
      # because transitive `indexmap` 2.x resolves to an edition2024 manifest
      # that requires cargo >= 1.85.
      - name: cargo check at MSRV (1.85)
        run: cargo check --all-features

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
