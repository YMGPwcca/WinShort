name: tmp-special-workspace-docs

on:
  push:
    branches:
      - wip/special-workspace-build

permissions:
  contents: write

jobs:
  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/special-workspace-build
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply docs and verify tree
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_special_workspace_docs.py
          cargo fmt --all -- --check
          cargo check --all-targets --all-features
          git diff --check
          grep -q "dedicated Special Workspace" README.md
          grep -q "workspace GUID and return-desktop GUID" docs/CONFIG_SCHEMA.md
          grep -q "Numbered Desktop 1–9 operations filter" docs/ARCHITECTURE.md
          grep -q "Hard process termination may leave an orphan" docs/TEST_PLAN.md
      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp_special_workspace_docs.py .github/workflows/tmp-special-workspace-docs.yml
          git add README.md CHANGELOG.md docs/ARCHITECTURE.md docs/CONFIG_SCHEMA.md docs/TEST_PLAN.md docs/WIN32_LIFETIME.md
          git commit -m "docs(desktop): document dedicated special workspace"
          git push origin HEAD:wip/special-workspace-build
