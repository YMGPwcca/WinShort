# cargo-deny policy for WinShort (#34).
# Deliberately small and intentional: vulnerability + license gates, with
# duplicate-version tolerance for the Windows/COM crate family.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licenses accepted for this project's dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"   # windows-rs family legitimately duplicates some crates
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
